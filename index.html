<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Hargun Panauti Tracker — a persistent, dramatic event tracker." />
  <title>Hargun Panauti Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <main class="shell">
    <header class="hero-header">
      <button class="ghost danger" id="resetAll" type="button" aria-label="Reset all tracker data">↻ <span>Reset All</span></button>
      <div class="eyebrow">THE UNFORTUNATE LOG</div>
      <h1><span>HARGUN</span><strong>PANAUTI</strong> <em>TRACKER</em></h1>
      <p class="tagline">Track every panauti. Destiny has a count.</p>
    </header>

    <section class="stats panel" aria-label="Tracker statistics">
      <div class="stat">
        <div class="label">↗ TOTAL PANAUTI COUNT</div>
        <div class="counter" id="totalCount">0</div>
      </div>
      <div class="divider"></div>
      <div class="stat last-stat">
        <div class="label">◷ LAST RECORDED</div>
        <div class="last" id="lastRecorded">No events yet</div>
      </div>
    </section>

    <section class="panel recorder">
      <div class="section-title">☠ <span>RECORD A NEW PANAUTI EVENT</span></div>
      <form id="eventForm" class="event-form">
        <div class="fields">
          <label>SEVERITY<select id="severity"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></label>
          <label>CATEGORY<select id="category">
            <option>SPC</option>
            <option>Faculty</option>
            <option>BATCH MEET</option>
            <option>heavy neend ke nawab contri</option>
            <option>Others — please specify</option>
          </select></label>
          <label id="otherCategoryWrap" class="hidden">SPECIFY CATEGORY<input id="otherCategory" type="text" maxlength="80" placeholder="Please specify..." /></label>
          <label>DATE &amp; TIME<input id="eventDate" type="datetime-local" /></label>
          <label>NOTES (OPTIONAL)<input id="notes" type="text" maxlength="120" placeholder="Add a note..." /></label>
        </div>
        <button class="submit-btn" id="submitEvent" type="submit">＋ SUBMIT PANAUTI</button>
      </form>
    </section>

    <section class="panel history-panel">
      <div class="section-row">
        <div class="section-title">◔ <span>PANAUTI HISTORY</span></div>
        <button class="ghost danger" id="clearHistory" type="button">⌫ Clear History</button>
      </div>
      <div class="history" id="history" aria-live="polite"></div>
      <button class="outline" id="viewAll" type="button">☷ &nbsp; View All History</button>
    </section>

    <section class="simple-scene" aria-label="Simple animated Sikh character">
      <div class="simple-ground"></div>
      <div class="simple-character" role="img" aria-label="Cute animated Sikh boy with a backpack">
        <div class="simple-turban"></div>
        <div class="simple-face"><i class="eye left"></i><i class="eye right"></i><span class="simple-beard"></span></div>
        <div class="simple-body"><span class="heart">♥</span></div>
        <div class="simple-arm left-arm"></div><div class="simple-arm right-arm"></div>
        <div class="simple-leg left-leg"></div><div class="simple-leg right-leg"></div>
        <div class="simple-bag"></div>
      </div>
      <div class="simple-caption">PANAUTI AGAIN 😭</div>
    </section>
    <footer>Local persistence enabled · Your history stays in this browser.</footer>
  </main>
  <dialog id="allHistoryDialog">
    <div class="dialog-head"><h2>All Panauti</h2><button id="closeDialog" class="close" type="button">×</button></div>
    <div id="allHistory" class="history"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
